// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'
        classpath 'com.google.gms:google-services:4.4.2'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // A transitive dependency (the Cordova bridge module Capacitor
    // generates) pulls in the legacy kotlin-stdlib-jdk7/jdk8 (1.6.21)
    // artifacts, which collide with the newer kotlin-stdlib (1.8.22) that
    // already has that same functionality merged in - causing
    // "Duplicate class" build failures. Safe to exclude project-wide since
    // kotlin-stdlib 1.8+ is a superset.
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
